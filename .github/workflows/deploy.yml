name: ci-cd
on:
  push:
    branches: [main]
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SERVICE: finops-test
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build and push
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.SERVICE }}:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          docker tag "$IMAGE" "${{ steps.login-ecr.outputs.registry }}/${{ env.SERVICE }}:latest"
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.SERVICE }}:latest"
      - name: Terraform apply
        working-directory: infra/aws
        run: |
          terraform init
          terraform apply -auto-approve
# start command used in the image: npm start
